<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviator Clone - UI Match</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #000; 
            overflow-x: hidden;
            touch-action: pan-y;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .panel-bg { background: #1b1c1d; }
        .input-bg { background: #000000; }
        .btn-quick { background: #141516; }
        
        .switch {
            position: relative; display: inline-block; width: 34px; height: 18px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333; transition: .4s; border-radius: 34px; border: 1px solid #555;
        }
        .slider:before {
            position: absolute; content: ""; height: 14px; width: 14px; left: 1px; bottom: 1px;
            background-color: #fca5a5; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #f97316; }
        input:checked + .slider:before { transform: translateX(16px); background-color: #fff; }

        /* Waiting Overlay */
        #waitingOverlay {
            background-color: #0a0b0c;
        }

        /* Centered container for image and loader */
        .waiting-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        /* Background image - 50% smaller */
        .waiting-bg-image {
            width: 150px;
            height: 150px;
            background-image: url('background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Thinner pill-shaped loader */
        .pill-loader {
            position: relative;
            width: 200px;
            height: 4px;
            background: rgba(20, 20, 30, 0.8);
            border-radius: 30px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.5);
        }

        .pill-loader::before {
            content: '';
            position: absolute;
            top: 0;
            left: -50%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #eab308, #fbbf24, #eab308, transparent);
            animation: slidePass 1.5s ease-in-out infinite;
            border-radius: 30px;
            box-shadow: 0 0 15px #eab308;
        }

        @keyframes slidePass {
            0% {
                left: -50%;
            }
            100% {
                left: 100%;
            }
        }

        .pill-loader::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 30px;
            box-shadow: inset 0 0 10px rgba(234, 179, 8, 0.4);
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        /* Hide multiplier during waiting */
        #ui-layer.waiting-state #multiplierDisplay,
        #ui-layer.waiting-state #statusText {
            opacity: 0 !important;
        }
    </style>
</head>
<body class="text-white select-none antialiased flex justify-center w-full">

    <audio id="aviator_sound" src="aviator_sound.mp3" loop></audio>

    <div class="w-full max-w-md bg-[#0a0b0c] min-h-screen flex flex-col relative pb-10">

        <div class="flex items-center justify-between px-3 py-2 bg-[#101112] border-b border-gray-800">
            <div class="flex items-center font-black text-xl text-orange-500 italic tracking-tighter leading-none">
                <span class="text-2xl">AVIATOR</span>
                <span class="text-[10px] ml-1 text-orange-400 font-bold not-italic translate-y-1">EXTRA<br>BET</span>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-green-500 font-bold text-lg tracking-tight">2,000.00</span>
                <div class="p-1 cursor-pointer">
                    <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </div>
            </div>
        </div>

        <div class="flex items-center px-2 py-1.5 bg-[#0b0c0d] overflow-x-auto no-scrollbar gap-2 text-xs font-bold w-full border-b border-gray-900 whitespace-nowrap" id="history">
            <span class="text-purple-500 bg-[#1a1120] px-2 py-0.5 rounded-full border border-purple-900/50">2.26x</span>
            <span class="text-purple-500 bg-[#1a1120] px-2 py-0.5 rounded-full border border-purple-900/50">3.33x</span>
            <span class="text-blue-400 bg-[#101622] px-2 py-0.5 rounded-full border border-blue-900/50">1.33x</span>
            <span class="text-blue-400 bg-[#101622] px-2 py-0.5 rounded-full border border-blue-900/50">1.31x</span>
            <span class="text-blue-400 bg-[#101622] px-2 py-0.5 rounded-full border border-blue-900/50">1.07x</span>
            <span class="text-purple-500 bg-[#1a1120] px-2 py-0.5 rounded-full border border-purple-900/50">3.94x</span>
            <span class="text-pink-500 bg-[#20101b] px-2 py-0.5 rounded-full border border-pink-900/50">28.09x</span>
            <div class="flex items-center justify-center bg-gray-800 rounded-full px-2 py-0.5 ml-auto opacity-70 cursor-pointer">
                <svg class="w-3 h-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
        </div>

        <div class="p-2 w-full">
            <div class="relative w-full aspect-[4/2.5] rounded-xl border-2 border-gray-800 bg-[#060b13] overflow-hidden shadow-lg">
                
                <div id="ui-layer" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none z-10">
                    <h1 id="multiplierDisplay" class="text-5xl sm:text-7xl font-black text-white drop-shadow-md">1.00x</h1>
                    <p id="statusText" class="text-sm font-bold uppercase tracking-wider text-red-500 mt-2 opacity-0 transition-opacity bg-black/50 px-3 py-1 rounded-full">Flew Away!</p>
                </div>

                <div id="waitingOverlay" class="absolute inset-0 flex items-center justify-center z-20 hidden">
                    <div class="waiting-content">
                        <div class="waiting-bg-image"></div>
                        <div class="pill-loader"></div>
                    </div>
                </div>

                <canvas id="gameCanvas" class="block w-full h-full"></canvas>
            </div>
        </div>

        <div class="flex flex-col gap-2 px-2 pb-2">
            
            <div class="panel-bg rounded-xl p-2 pb-3">
                <div class="flex justify-between items-center mb-2 px-1">
                    <div class="flex bg-[#0b0c0d] rounded-full text-xs font-semibold overflow-hidden p-0.5">
                        <button class="bg-gray-700 text-white px-5 py-1.5 rounded-full">Bet</button>
                        <button class="text-gray-400 px-5 py-1.5 rounded-full">Auto</button>
                    </div>
                    <div class="flex items-center gap-2 text-xs text-gray-400 font-semibold">
                        <span>Extra Bet</span>
                        <label class="switch">
                            <input type="checkbox">
                            <span class="slider"></span>
                        </label>
                        <div class="bg-gray-700 text-gray-300 rounded-full w-4 h-4 flex items-center justify-center text-[10px] cursor-pointer">?</div>
                    </div>
                </div>
                
                <div class="flex gap-2 h-[80px]">
                    <div class="flex flex-col gap-1 w-5/12">
                        <div class="input-bg flex items-center justify-between rounded-full px-2 py-1 border border-gray-800">
                            <button class="w-6 h-6 rounded-full border border-gray-600 flex items-center justify-center text-gray-300 hover:bg-gray-800 font-bold"> - </button>
                            <span class="font-bold text-lg">0.10</span>
                            <button class="w-6 h-6 rounded-full border border-gray-600 flex items-center justify-center text-gray-300 hover:bg-gray-800 font-bold"> + </button>
                        </div>
                        <div class="grid grid-cols-2 gap-1 text-xs font-bold text-gray-400">
                            <button class="btn-quick rounded-full py-1 border border-transparent hover:border-gray-700">0.10</button>
                            <button class="btn-quick rounded-full py-1 border border-transparent hover:border-gray-700">0.20</button>
                            <button class="btn-quick rounded-full py-1 border border-transparent hover:border-gray-700">0.50</button>
                            <button class="btn-quick rounded-full py-1 border border-transparent hover:border-gray-700">1.00</button>
                        </div>
                    </div>
                    <button class="w-7/12 bg-[#28a909] hover:bg-[#2fb90d] active:bg-[#208707] transition-colors rounded-[14px] flex flex-col items-center justify-center text-white font-bold shadow-[inset_0_-3px_0_rgba(0,0,0,0.2)] border border-[#30cc0b] cursor-pointer" onclick="document.getElementById('aviator_sound').play().catch(e=>{})">
                        <span class="text-xl tracking-wide uppercase shadow-sm">Bet</span>
                        <span class="text-lg leading-tight">0.10</span>
                    </button>
                </div>
            </div>

            <div class="panel-bg rounded-xl p-2 pb-3">
                <div class="flex justify-between items-center mb-2 px-1">
                    <div class="flex bg-[#0b0c0d] rounded-full text-xs font-semibold overflow-hidden p-0.5">
                        <button class="bg-gray-700 text-white px-5 py-1.5 rounded-full">Bet</button>
                        <button class="text-gray-400 px-5 py-1.5 rounded-full">Auto</button>
                    </div>
                    <div class="flex items-center gap-2 text-xs text-gray-400 font-semibold">
                        <span>Extra Bet</span>
                        <label class="switch">
                            <input type="checkbox">
                            <span class="slider"></span>
                        </label>
                        <div class="bg-gray-700 text-gray-300 rounded-full w-4 h-4 flex items-center justify-center text-[10px] cursor-pointer">?</div>
                    </div>
                </div>
                
                <div class="flex gap-2 h-[80px]">
                    <div class="flex flex-col gap-1 w-5/12">
                        <div class="input-bg flex items-center justify-between rounded-full px-2 py-1 border border-gray-800">
                            <button class="w-6 h-6 rounded-full border border-gray-600 flex items-center justify-center text-gray-300 hover:bg-gray-800 font-bold"> - </button>
                            <span class="font-bold text-lg">0.10</span>
                            <button class="w-6 h-6 rounded-full border border-gray-600 flex items-center justify-center text-gray-300 hover:bg-gray-800 font-bold"> + </button>
                        </div>
                        <div class="grid grid-cols-2 gap-1 text-xs font-bold text-gray-400">
                            <button class="btn-quick rounded-full py-1 border border-transparent hover:border-gray-700">0.10</button>
                            <button class="btn-quick rounded-full py-1 border border-transparent hover:border-gray-700">0.20</button>
                            <button class="btn-quick rounded-full py-1 border border-transparent hover:border-gray-700">0.50</button>
                            <button class="btn-quick rounded-full py-1 border border-transparent hover:border-gray-700">1.00</button>
                        </div>
                    </div>
                    <button class="w-7/12 bg-[#28a909] hover:bg-[#2fb90d] active:bg-[#208707] transition-colors rounded-[14px] flex flex-col items-center justify-center text-white font-bold shadow-[inset_0_-3px_0_rgba(0,0,0,0.2)] border border-[#30cc0b] cursor-pointer" onclick="document.getElementById('aviator_sound').play().catch(e=>{})">
                        <span class="text-xl tracking-wide uppercase shadow-sm">Bet</span>
                        <span class="text-lg leading-tight">0.10</span>
                    </button>
                </div>
            </div>

        </div>

        <div class="px-2 pb-4">
            <div class="panel-bg rounded-xl overflow-hidden flex flex-col min-h-[150px]">
                <div class="flex bg-[#101112] text-xs font-semibold border-b border-gray-800">
                    <button class="flex-1 py-3 text-white border-b-2 border-orange-500 bg-[#1a1b1d]">All Bets</button>
                    <button class="flex-1 py-3 text-gray-500 hover:text-gray-300">My Bets</button>
                    <button class="flex-1 py-3 text-gray-500 hover:text-gray-300">Top</button>
                </div>
                <div class="flex justify-between items-center p-3">
                    <div class="leading-tight">
                        <div class="text-[11px] font-bold text-gray-400">ALL BETS</div>
                        <div class="text-lg font-bold">0</div>
                    </div>
                    <button class="flex items-center gap-1 text-[11px] font-bold text-gray-400 bg-transparent border border-gray-700 rounded-full px-3 py-1 hover:bg-gray-800">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Previous hand
                    </button>
                </div>
                <div class="flex px-3 pb-2 text-[10px] text-gray-500 font-bold uppercase">
                    <div class="w-1/3 text-left">User</div>
                    <div class="w-1/3 text-center">Bet X</div>
                    <div class="w-1/3 text-right">Cash out</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const mDisplay = document.getElementById('multiplierDisplay');
        const statusText = document.getElementById('statusText');
        const waitingOverlay = document.getElementById('waitingOverlay');
        const uiLayer = document.getElementById('ui-layer');
        const bgSound = document.getElementById('aviator_sound');

        let state = 'WAITING'; 
        let multiplier = 1.00;
        let startTime = 0;
        let crashPoint = 0;
        let pathPoints = [];
        let crashStartTime = 0;
        let lastInGamePos = { x: 0, y: 0 };

        function resize() {
            canvas.width = canvas.offsetWidth * window.devicePixelRatio;
            canvas.height = canvas.offsetHeight * window.devicePixelRatio;
        }
        window.addEventListener('resize', resize);
        resize();

        function startWaiting() {
            state = 'WAITING';
            bgSound.pause();
            bgSound.currentTime = 0;
            waitingOverlay.classList.remove('hidden');
            uiLayer.classList.add('waiting-state');
            statusText.style.opacity = '0';
            mDisplay.innerText = "1.00x";
            mDisplay.classList.remove('text-red-500');
            mDisplay.classList.add('text-white');
            pathPoints = [];
            setTimeout(() => {
                waitingOverlay.classList.add('hidden');
                uiLayer.classList.remove('waiting-state');
                startGame();
            }, 5000);
        }

        function startGame() {
            state = 'IN_GAME';
            bgSound.play().catch(e => console.log("Audio waiting for user interaction"));
            multiplier = 1.00;
            crashPoint = Math.max(1, (0.99 / (1 - Math.random()))).toFixed(2);
            startTime = performance.now();
            requestAnimationFrame(update);
        }

        function crash() {
            state = 'CRASHED';
            crashStartTime = performance.now();
            statusText.style.opacity = '1';
            mDisplay.classList.remove('text-white');
            mDisplay.classList.add('text-red-500');
            setTimeout(startWaiting, 2500);
        }

        function update(now) {
            if (state === 'WAITING') {
                draw(0, now);
                requestAnimationFrame(update);
                return;
            }
            const elapsed = (now - startTime) / 1000;

            if (state === 'IN_GAME') {
                multiplier = Math.pow(Math.E, 0.07 * elapsed);
                if (multiplier >= crashPoint) {
                    multiplier = parseFloat(crashPoint);
                    crash();
                }
            }
            mDisplay.innerText = multiplier.toFixed(2) + 'x';
            draw(elapsed, now);
            requestAnimationFrame(update);
        }

        function drawRays(ctx, w, h, now) {
            ctx.save();
            ctx.translate(w / 2, h + 100); 
            ctx.rotate(now * 0.0002);
            const numRays = 24;
            const angleStep = (Math.PI * 2) / numRays;
            
            for (let i = 0; i < numRays; i++) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, w * 2, i * angleStep, (i + 0.5) * angleStep);
                ctx.lineTo(0, 0);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.015)';
                ctx.fill();
            }
            ctx.restore();
        }

        function drawPlane(ctx) {
            ctx.save();
            ctx.fillStyle = '#ff6b00';
            
            ctx.beginPath();
            ctx.moveTo(35, 0);
            ctx.lineTo(10, -6);
            ctx.lineTo(-5, -6);
            ctx.lineTo(-20, -22);
            ctx.lineTo(-28, -22);
            ctx.lineTo(-22, -2);
            ctx.lineTo(-30, 2);
            ctx.lineTo(-22, 6);
            ctx.lineTo(-10, 6);
            ctx.lineTo(-18, 20);
            ctx.lineTo(-5, 18);
            ctx.lineTo(10, 6);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.moveTo(15, -2);
            ctx.lineTo(8, -5);
            ctx.lineTo(0, -5);
            ctx.lineTo(5, -2);
            ctx.fill();

            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff6b00';
            ctx.stroke();

            ctx.restore();
        }

        function draw(t, now) {
            const w = canvas.width;
            const h = canvas.height;
            const paddingX = w * 0.05;
            const paddingY = h * 0.1;
            
            ctx.clearRect(0, 0, w, h);
            
            drawRays(ctx, w, h, now);

            ctx.fillStyle = '#0ea5e9';
            for(let i = 20; i < h - 20; i += h * 0.15) {
                ctx.beginPath(); ctx.arc(15, i, 3, 0, Math.PI*2); ctx.fill();
            }
            ctx.fillStyle = '#e2e8f0';
            for(let i = 40; i < w; i += w * 0.1) {
                ctx.beginPath(); ctx.arc(i, h - 15, 3, 0, Math.PI*2); ctx.fill();
            }

            if (state === 'WAITING') return;

            let tx, ty;
            const startX = 15;
            const startY = h - 15;

            if (state === 'IN_GAME') {
                tx = startX + (w * 0.8) * (1 - Math.exp(-t / 4));
                const baseTy = startY - (h * 0.7) * (1 - Math.exp(-t / 5));
                const wobble = Math.sin(t * 2) * (15 * Math.exp(-t / 10));
                ty = baseTy + wobble;
                
                lastInGamePos = { x: tx, y: ty };
                pathPoints.push({ x: tx, y: ty });
            } else {
                const dt = (now - crashStartTime) / 1000;
                tx = lastInGamePos.x + (dt * 1500);
                ty = lastInGamePos.y - (dt * 800);
            }

            if (pathPoints.length > 1) {
                ctx.beginPath();
                ctx.moveTo(pathPoints[0].x, startY);
                for (let p of pathPoints) ctx.lineTo(p.x, p.y);
                if (state === 'IN_GAME') ctx.lineTo(tx, startY);
                else ctx.lineTo(lastInGamePos.x, startY);
                ctx.closePath();
                
                const grad = ctx.createLinearGradient(0, ty, 0, startY);
                grad.addColorStop(0, 'rgba(249, 115, 22, 0.4)');
                grad.addColorStop(1, 'rgba(249, 115, 22, 0)');
                ctx.fillStyle = grad;
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(pathPoints[0].x, pathPoints[0].y);
                for (let p of pathPoints) ctx.lineTo(p.x, p.y);
                ctx.strokeStyle = '#f97316';
                ctx.lineWidth = 5;
                ctx.lineJoin = 'round';
                ctx.stroke();
            }

            if (tx < w + 100) {
                ctx.save();
                ctx.translate(tx, ty);
                const angle = state === 'IN_GAME' ? -0.25 + (Math.cos(t * 2) * 0.05) : -0.3;
                ctx.rotate(angle);
                drawPlane(ctx);
                ctx.restore();
            }
        }

        startWaiting();
    </script>
</body>
</html>
