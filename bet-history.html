
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>J188 | Complete Betting History</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #0f0f0f 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            color: #e5e5e5;
            min-height: 100vh;
        }

        /* Animated background effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 40%, rgba(247, 201, 72, 0.03) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px 20px 48px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 34, 34, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(247, 201, 72, 0.3);
            border-radius: 40px;
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
            color: #f7c948;
        }

        .back-btn:hover {
            background: rgba(247, 201, 72, 0.15);
            transform: translateX(-3px);
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #f7c948 0%, #e0a800 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .title-section h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #f7c948);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .title-section p {
            font-size: 13px;
            color: #888;
            margin-top: 4px;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: linear-gradient(135deg, #141414, #111111);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(247, 201, 72, 0.12);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            border-color: rgba(247, 201, 72, 0.25);
        }

        .stat-icon {
            font-size: 28px;
            margin-bottom: 12px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 800;
            color: #f7c948;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: #888;
            letter-spacing: 0.5px;
        }

        /* Filter Bar */
        .filter-bar {
            background: linear-gradient(135deg, #141414, #111111);
            border-radius: 20px;
            padding: 16px 20px;
            margin-bottom: 24px;
            border: 1px solid rgba(247, 201, 72, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .filter-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(34, 34, 34, 0.8);
            border: 1px solid rgba(247, 201, 72, 0.2);
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            color: #aaa;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: rgba(247, 201, 72, 0.15);
            border-color: #f7c948;
            color: #f7c948;
        }

        .filter-btn:hover {
            border-color: rgba(247, 201, 72, 0.4);
            color: #f7c948;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(247, 201, 72, 0.15);
            border-radius: 40px;
            padding: 8px 16px;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 13px;
            width: 180px;
        }

        .search-box input::placeholder {
            color: #666;
        }

        /* Bet History Table */
        .history-container {
            background: linear-gradient(135deg, #141414, #111111);
            border-radius: 24px;
            border: 1px solid rgba(247, 201, 72, 0.12);
            overflow: hidden;
        }

        .table-header {
            display: grid;
            grid-template-columns: 80px 1fr 1.2fr 1fr 1fr 1.2fr 100px;
            background: rgba(0, 0, 0, 0.4);
            padding: 16px 20px;
            border-bottom: 1px solid rgba(247, 201, 72, 0.1);
            font-size: 12px;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .bet-row {
            display: grid;
            grid-template-columns: 80px 1fr 1.2fr 1fr 1fr 1.2fr 100px;
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
            cursor: pointer;
            align-items: center;
        }

        .bet-row:hover {
            background: rgba(247, 201, 72, 0.05);
            transform: scale(1.01);
        }

        .bet-id {
            font-family: monospace;
            font-size: 11px;
            color: #f7c948;
        }

        .game-name {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .amount {
            font-weight: 600;
        }

        .multiplier {
            color: #f7c948;
            font-weight: 700;
        }

        .result-win {
            color: #4caf50;
            font-weight: 700;
        }

        .result-loss {
            color: #ff6b6b;
            font-weight: 700;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 600;
            width: fit-content;
        }

        .status-won {
            background: rgba(76, 175, 80, 0.15);
            border: 1px solid rgba(76, 175, 80, 0.3);
            color: #4caf50;
        }

        .status-lost {
            background: rgba(255, 107, 107, 0.15);
            border: 1px solid rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
        }

        .view-icon {
            opacity: 0;
            transition: opacity 0.2s;
            color: #f7c948;
        }

        .bet-row:hover .view-icon {
            opacity: 1;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 24px;
            border-top: 1px solid rgba(247, 201, 72, 0.1);
        }

        .page-btn {
            background: rgba(34, 34, 34, 0.8);
            border: 1px solid rgba(247, 201, 72, 0.2);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            font-weight: 600;
            color: #aaa;
        }

        .page-btn.active {
            background: rgba(247, 201, 72, 0.2);
            border-color: #f7c948;
            color: #f7c948;
        }

        .page-btn:hover:not(.disabled) {
            background: rgba(247, 201, 72, 0.15);
            border-color: #f7c948;
            color: #f7c948;
        }

        .page-btn.disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 40px;
        }

        .empty-state .material-icons {
            font-size: 64px;
            color: #333;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            color: #888;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: #666;
            font-size: 13px;
        }

        /* Loading State */
        .loading-state {
            text-align: center;
            padding: 80px 40px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(247, 201, 72, 0.2);
            border-top-color: #f7c948;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Toast Message */
        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e1e1e;
            color: #f7c948;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 12px;
            border-left: 3px solid #f7c948;
            z-index: 1000;
            animation: fadeOut 2s ease forwards;
        }

        @keyframes fadeOut {
            0% { opacity: 1; transform: translateX(-50%) translateY(0); }
            70% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); visibility: hidden; }
        }

        @media (max-width: 1000px) {
            .table-header, .bet-row {
                grid-template-columns: 60px 0.8fr 1fr 0.8fr 0.8fr 1fr 70px;
                gap: 8px;
                font-size: 12px;
            }
        }

        @media (max-width: 768px) {
            .table-header {
                display: none;
            }
            .bet-row {
                grid-template-columns: 1fr;
                gap: 12px;
                padding: 16px;
                position: relative;
            }
            .bet-row::before {
                content: '';
                position: absolute;
                left: 0;
                top: 10px;
                bottom: 10px;
                width: 3px;
                background: #f7c948;
                border-radius: 3px;
            }
            .bet-id, .game-name, .amount, .multiplier, .result, .status-badge {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .bet-id::before, .game-name::before, .amount::before, .multiplier::before, .result::before {
                content: attr(data-label);
                font-size: 11px;
                color: #888;
                font-weight: 500;
            }
            .view-icon {
                position: absolute;
                right: 16px;
                top: 16px;
                opacity: 1;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .title-section h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <div class="back-btn" id="backBtn">
                    <span class="material-icons" style="font-size: 18px;">arrow_back</span>
                    <span>Back</span>
                </div>
                <div class="logo">J188</div>
            </div>
            <div class="title-section">
                <h1>Betting History</h1>
                <p>Complete record of all your wagers and outcomes</p>
            </div>
            <div style="width: 80px;"></div>
        </div>

        <!-- Stats Cards -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-value" id="totalBets">0</div>
                <div class="stat-label">Total Bets</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💰</div>
                <div class="stat-value" id="totalWagered">$0</div>
                <div class="stat-label">Total Wagered</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🏆</div>
                <div class="stat-value" id="totalWon">$0</div>
                <div class="stat-label">Total Won</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📈</div>
                <div class="stat-value" id="winRate">0%</div>
                <div class="stat-label">Win Rate</div>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
            <div class="filter-group">
                <button class="filter-btn active" data-filter="all">All Bets</button>
                <button class="filter-btn" data-filter="win">Won</button>
                <button class="filter-btn" data-filter="loss">Lost</button>
            </div>
            <div class="search-box">
                <span class="material-icons" style="font-size: 18px; color: #666;">search</span>
                <input type="text" id="searchInput" placeholder="Search by ID or game...">
            </div>
        </div>

        <!-- History Table -->
        <div class="history-container">
            <div class="table-header">
                <span>ID</span>
                <span>Game</span>
                <span>Stake</span>
                <span>Multiplier</span>
                <span>Cashout</span>
                <span>Result</span>
                <span></span>
            </div>
            <div id="historyList">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading your betting history...</p>
                </div>
            </div>
            <div class="pagination" id="pagination">
                <!-- Pagination will be injected here -->
            </div>
        </div>
    </div>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAM3XBYaYpUYld7LJsZpzJ9mZB50m5CUOw",
            authDomain: "aviator-82cdb.firebaseapp.com",
            projectId: "aviator-82cdb",
            databaseURL: "https://aviator-82cdb-default-rtdb.firebaseio.com"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();
        
        let allBets = [];
        let filteredBets = [];
        let currentPage = 1;
        let currentFilter = 'all';
        let searchQuery = '';
        const itemsPerPage = 15;
        
        // DOM Elements
        const historyList = document.getElementById('historyList');
        const paginationDiv = document.getElementById('pagination');
        const totalBetsSpan = document.getElementById('totalBets');
        const totalWageredSpan = document.getElementById('totalWagered');
        const totalWonSpan = document.getElementById('totalWon');
        const winRateSpan = document.getElementById('winRate');
        const searchInput = document.getElementById('searchInput');
        
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast-message';
            toast.innerText = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
        
        // Generate short bet ID
        function generateShortId(timestamp, index) {
            const date = new Date(timestamp || Date.now());
            return `${date.getMonth()+1}${date.getDate()}${String(index).slice(-3)}`;
        }
        
        // Format currency
        function formatCurrency(amount) {
            return `$${amount.toFixed(2)}`;
        }
        
        // Format date for display
        function formatDate(timestamp) {
            if (!timestamp) return 'N/A';
            const date = new Date(timestamp);
            return `${date.getMonth()+1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2,'0')}`;
        }
        
        // Update statistics
        function updateStatistics(bets) {
            const realBets = bets.filter(b => b.status !== 'welcome' && b.betAmount > 0);
            const total = realBets.length;
            const totalWagered = realBets.reduce((sum, b) => sum + (b.betAmount || 0), 0);
            const totalWon = realBets.reduce((sum, b) => sum + ((b.cashoutAmount || 0) - (b.betAmount || 0)), 0);
            const wins = realBets.filter(b => ((b.cashoutAmount || 0) - (b.betAmount || 0)) > 0).length;
            const winRate = total > 0 ? ((wins / total) * 100).toFixed(1) : 0;
            
            totalBetsSpan.innerText = total;
            totalWageredSpan.innerText = formatCurrency(totalWagered);
            totalWonSpan.innerText = (totalWon >= 0 ? '+' : '') + formatCurrency(totalWon);
            winRateSpan.innerText = `${winRate}%`;
        }
        
        // Apply filters
        function applyFilters() {
            let filtered = [...allBets];
            
            // Remove welcome bets
            filtered = filtered.filter(b => b.status !== 'welcome' && b.betAmount > 0);
            
            // Apply win/loss filter
            if (currentFilter === 'win') {
                filtered = filtered.filter(b => ((b.cashoutAmount || 0) - (b.betAmount || 0)) > 0);
            } else if (currentFilter === 'loss') {
                filtered = filtered.filter(b => ((b.cashoutAmount || 0) - (b.betAmount || 0)) <= 0);
            }
            
            // Apply search
            if (searchQuery) {
                const query = searchQuery.toLowerCase();
                filtered = filtered.filter(b => {
                    const id = generateShortId(b.timestamp, b._index || 0).toLowerCase();
                    const game = (b.game || 'Aviator').toLowerCase();
                    return id.includes(query) || game.includes(query);
                });
            }
            
            filteredBets = filtered;
            currentPage = 1;
            renderHistory();
            renderPagination();
        }
        
        // Render history list
        function renderHistory() {
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageBets = filteredBets.slice(start, end);
            
            if (pageBets.length === 0) {
                historyList.innerHTML = `
                    <div class="empty-state">
                        <span class="material-icons">history</span>
                        <h3>No bets found</h3>
                        <p>Try adjusting your filters or place your first bet!</p>
                    </div>
                `;
                return;
            }
            
            historyList.innerHTML = pageBets.map((bet, idx) => {
                const globalIndex = allBets.findIndex(b => b.timestamp === bet.timestamp && b.betAmount === bet.betAmount);
                const betAmount = bet.betAmount || 0;
                const cashoutAmount = bet.cashoutAmount || 0;
                const multiplier = bet.multiplier || 0;
                const result = cashoutAmount - betAmount;
                const isWin = result > 0;
                const betId = generateShortId(bet.timestamp, globalIndex);
                const dateStr = formatDate(bet.timestamp);
                
                return `
                    <div class="bet-row" data-bet-index="${globalIndex}" data-bet='${JSON.stringify(bet).replace(/'/g, "&#39;")}'>
                        <div class="bet-id" data-label="ID">#${betId}</div>
                        <div class="game-name" data-label="Game">
                            <span>✈️</span> ${bet.game || 'Aviator'}
                        </div>
                        <div class="amount" data-label="Stake">${formatCurrency(betAmount)}</div>
                        <div class="multiplier" data-label="Multiplier">${multiplier.toFixed(2)}x</div>
                        <div class="amount" data-label="Cashout">${formatCurrency(cashoutAmount)}</div>
                        <div class="result ${isWin ? 'result-win' : 'result-loss'}" data-label="Result">
                            ${isWin ? '+' : ''}${formatCurrency(result)}
                        </div>
                        <div class="view-icon">
                            <span class="material-icons" style="font-size: 18px;">chevron_right</span>
                        </div>
                    </div>
                `;
            }).join('');
            
            // Add click handlers to each row
            document.querySelectorAll('.bet-row').forEach(row => {
                row.addEventListener('click', (e) => {
                    const betData = JSON.parse(row.dataset.bet);
                    navigateToBetPreview(betData, row.dataset.betIndex);
                });
            });
        }
        
        // Render pagination
        function renderPagination() {
            const totalPages = Math.ceil(filteredBets.length / itemsPerPage);
            if (totalPages <= 1) {
                paginationDiv.innerHTML = '';
                return;
            }
            
            let paginationHtml = `
                <div class="page-btn ${currentPage === 1 ? 'disabled' : ''}" data-page="prev">
                    <span class="material-icons" style="font-size: 16px;">chevron_left</span>
                </div>
            `;
            
            // Show page numbers
            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(totalPages, currentPage + 2);
            
            if (startPage > 1) {
                paginationHtml += `<div class="page-btn" data-page="1">1</div>`;
                if (startPage > 2) paginationHtml += `<div class="page-btn disabled">...</div>`;
            }
            
            for (let i = startPage; i <= endPage; i++) {
                paginationHtml += `<div class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</div>`;
            }
            
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) paginationHtml += `<div class="page-btn disabled">...</div>`;
                paginationHtml += `<div class="page-btn" data-page="${totalPages}">${totalPages}</div>`;
            }
            
            paginationHtml += `
                <div class="page-btn ${currentPage === totalPages ? 'disabled' : ''}" data-page="next">
                    <span class="material-icons" style="font-size: 16px;">chevron_right</span>
                </div>
            `;
            
            paginationDiv.innerHTML = paginationHtml;
            
            // Add click handlers
            document.querySelectorAll('.page-btn:not(.disabled)').forEach(btn => {
                btn.addEventListener('click', () => {
                    const page = btn.dataset.page;
                    if (page === 'prev' && currentPage > 1) {
                        currentPage--;
                    } else if (page === 'next' && currentPage < totalPages) {
                        currentPage++;
                    } else if (!isNaN(parseInt(page))) {
                        currentPage = parseInt(page);
                    }
                    renderHistory();
                    renderPagination();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            });
        }
        
        // Navigate to bet preview
        function navigateToBetPreview(betData, index) {
            const betDataStr = encodeURIComponent(JSON.stringify(betData));
            window.location.href = `bet-slip-preview.html?bet=${betDataStr}&index=${index}`;
        }
        
        // Load user bets from Firebase
        async function loadUserBets(uid) {
            try {
                const historySnap = await database.ref(`users/${uid}/betHistory/history`).once('value');
                let bets = historySnap.val() || [];
                
                // Handle different data structures
                if (!Array.isArray(bets)) {
                    if (bets.history && Array.isArray(bets.history)) {
                        bets = bets.history;
                    } else {
                        bets = [];
                    }
                }
                
                // Sort by timestamp descending (newest first)
                allBets = bets.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                
                // Add index for ID generation
                allBets.forEach((bet, idx) => { bet._index = idx; });
                
                updateStatistics(allBets);
                applyFilters();
                
            } catch (error) {
                console.error('Error loading bets:', error);
                historyList.innerHTML = `
                    <div class="empty-state">
                        <span class="material-icons">error_outline</span>
                        <h3>Error Loading History</h3>
                        <p>Unable to load your betting history. Please try again.</p>
                    </div>
                `;
                showToast('Error loading betting history');
            }
        }
        
        // Initialize event listeners
        function initEventListeners() {
            // Back button
            document.getElementById('backBtn').addEventListener('click', () => {
                window.history.back();
            });
            
            // Filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    applyFilters();
                });
            });
            
            // Search input with debounce
            let searchTimeout;
            searchInput.addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    searchQuery = e.target.value;
                    applyFilters();
                }, 300);
            });
        }
        
        // Auth check
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = "auth.html";
                return;
            }
            if (!user.emailVerified) {
                alert("Please verify your email before accessing betting history.");
                await auth.signOut();
                window.location.href = "auth.html";
                return;
            }
            await loadUserBets(user.uid);
            initEventListeners();
        });
    </script>
</body>
</html>
