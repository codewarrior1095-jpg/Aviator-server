
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J188 Auth</title>
<style>
/* YOUR EXISTING CSS - KEEP IT THE SAME */
body {
  margin: 0;
  background: #0b0b0b;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: #fff;
}

.container {
  width: 360px;
  background: #151515;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 0 30px rgba(0,0,0,0.6);
}

.logo {
  text-align: center;
  color: #f7c948;
  font-weight: bold;
  font-size: 24px;
  margin-bottom: 10px;
}

.tabs {
  display: flex;
  border-bottom: 1px solid #333;
  margin-bottom: 15px;
}

.tab {
  flex: 1;
  text-align: center;
  padding: 10px;
  cursor: pointer;
  color: #aaa;
}

.tab.active {
  color: #f7c948;
  border-bottom: 2px solid #f7c948;
}

.input-box {
  background: #222;
  border-radius: 6px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  padding: 10px;
}

.input-box input {
  background: transparent;
  border: none;
  outline: none;
  color: white;
  flex: 1;
}

.strength {
  height: 4px;
  background: #333;
  margin-bottom: 10px;
  border-radius: 5px;
  overflow: hidden;
}

.strength div {
  height: 100%;
  width: 0%;
  background: #f7c948;
  transition: 0.3s;
}

.button {
  width: 100%;
  background: linear-gradient(90deg,#f7c948,#e0a800);
  border: none;
  padding: 12px;
  border-radius: 6px;
  font-weight: bold;
  margin-top: 10px;
  cursor: pointer;
}

.hidden {
  display: none;
}

.footer {
  text-align: center;
  font-size: 12px;
  color: #aaa;
  margin-top: 10px;
}

.checkbox-wrapper {
  background: #222;
  border-radius: 6px;
  margin-bottom: 10px;
  padding: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.checkbox-wrapper input {
  width: 18px;
  height: 18px;
  margin: 0;
  cursor: pointer;
}

.checkbox-wrapper label {
  color: #ddd;
  font-size: 14px;
  cursor: pointer;
}

.error-message {
  color: #ff6b6b;
  font-size: 12px;
  margin-top: -8px;
  margin-bottom: 8px;
  padding-left: 8px;
}
</style>
</head>
<body>

<div class="container">
  <div class="logo">J188.com</div>

  <div class="tabs">
    <div id="signupTab" class="tab active" onclick="showSignup()">Register</div>
    <div id="loginTab" class="tab" onclick="showLogin()">Login</div>
  </div>

  <!-- SIGNUP -->
  <div id="signupBox">
    <div class="input-box">
      <input id="signupFirstName" placeholder="First Name">
    </div>

    <div class="input-box">
      <input id="signupSurname" placeholder="Surname">
    </div>

    <div class="input-box">
      <input id="signupPhone" placeholder="Phone Number">
    </div>

    <div class="input-box">
      <input id="signupEmail" placeholder="Enter email">
    </div>

    <div class="input-box">
      <input id="signupPassword" type="password" placeholder="Enter password" oninput="strengthCheck()">
    </div>

    <div class="strength"><div id="strengthBar"></div></div>

    <div class="input-box">
      <input id="confirmPassword" type="password" placeholder="Enter password again">
    </div>

    <div class="checkbox-wrapper">
      <input type="checkbox" id="ageCheckbox">
      <label for="ageCheckbox">I confirm I am 18 years or older</label>
    </div>

    <button class="button" onclick="signup()">Register</button>
  </div>

  <!-- LOGIN -->
  <div id="loginBox" class="hidden">
    <div class="input-box">
      <input id="loginEmail" placeholder="Email">
    </div>

    <div class="input-box">
      <input id="loginPassword" type="password" placeholder="Password">
    </div>

    <button class="button" onclick="login()">Login</button>
  </div>

  <!-- SUCCESS SCREEN -->
  <div id="successScreen" class="hidden" style="text-align:center;">
    <h2 style="color:#f7c948;">✅ Registration Successful</h2>
    <p>We have sent a confirmation link to:</p>
    <p id="userEmail" style="color:#f7c948; font-weight:bold;"></p>
    <p>Please check your Gmail and confirm your account.</p>
    <p>After confirming, come back and login.</p>
    <button class="button" onclick="showLogin()">Go to Login</button>
  </div>

  <div class="footer" id="status"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  sendEmailVerification,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAM3XBYaYpUYld7LJsZpzJ9mZB50m5CUOw",
  authDomain: "aviator-82cdb.firebaseapp.com",
  projectId: "aviator-82cdb",
  databaseURL: "https://aviator-82cdb-default-rtdb.firebaseio.com"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const database = getDatabase(app);

// ✅ CRITICAL: Enable persistence so user stays logged in
setPersistence(auth, browserLocalPersistence);

const status = document.getElementById("status");

// Check if already logged in (redirect to homepage)
onAuthStateChanged(auth, (user) => {
  if (user && user.emailVerified) {
    // User is already logged in - send to homepage
    window.location.href = "homepage.html";
  }
});

function clearErrors() {
  const existingErrors = document.querySelectorAll('.error-message');
  existingErrors.forEach(el => el.remove());
}

function showFieldError(fieldId, message) {
  const field = document.getElementById(fieldId);
  if (!field) return;
  const existingError = field.parentElement.nextElementSibling;
  if (existingError && existingError.classList && existingError.classList.contains('error-message')) {
    existingError.remove();
  }
  const errorDiv = document.createElement('div');
  errorDiv.className = 'error-message';
  errorDiv.innerText = message;
  field.parentElement.insertAdjacentElement('afterend', errorDiv);
}

function validateSignupForm(firstName, surname, phone, email, password, confirmPassword, isAdultChecked) {
  let isValid = true;
  clearErrors();

  if (!firstName || firstName.trim() === "") {
    showFieldError('signupFirstName', 'First name is required');
    isValid = false;
  }

  if (!surname || surname.trim() === "") {
    showFieldError('signupSurname', 'Surname is required');
    isValid = false;
  }

  if (!phone || phone.trim() === "") {
    showFieldError('signupPhone', 'Phone number is required');
    isValid = false;
  }

  const emailPattern = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
  if (!email || email.trim() === "") {
    showFieldError('signupEmail', 'Email is required');
    isValid = false;
  } else if (!emailPattern.test(email.trim())) {
    showFieldError('signupEmail', 'Please enter a valid email address');
    isValid = false;
  }

  if (!password || password.length < 6) {
    showFieldError('signupPassword', 'Password must be at least 6 characters');
    isValid = false;
  }

  if (password !== confirmPassword) {
    showFieldError('confirmPassword', 'Passwords do not match');
    isValid = false;
  }

  if (!isAdultChecked) {
    const checkboxWrapper = document.querySelector('.checkbox-wrapper');
    const existingErr = checkboxWrapper.nextElementSibling;
    if (existingErr && existingErr.classList && existingErr.classList.contains('error-message')) {
      existingErr.remove();
    }
    const errorDiv = document.createElement('div');
    errorDiv.className = 'error-message';
    errorDiv.innerText = 'You must confirm you are 18 years or older';
    checkboxWrapper.insertAdjacentElement('afterend', errorDiv);
    isValid = false;
  }

  return isValid;
}

window.signup = async () => {
  const firstName = document.getElementById("signupFirstName").value;
  const surname = document.getElementById("signupSurname").value;
  const phone = document.getElementById("signupPhone").value;
  const email = document.getElementById("signupEmail").value;
  const password = document.getElementById("signupPassword").value;
  const confirm = document.getElementById("confirmPassword").value;
  const isAdultChecked = document.getElementById("ageCheckbox").checked;

  if (!validateSignupForm(firstName, surname, phone, email, password, confirm, isAdultChecked)) {
    status.innerText = "Please fix the errors above.";
    return;
  }

  try {
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;
    const uid = user.uid;

    await sendEmailVerification(user);

    const userData = {
      uid: uid,
      firstName: firstName.trim(),
      surname: surname.trim(),
      phone: phone.trim(),
      email: email.trim(),
      isAdult: true,
      createdAt: Date.now(),
      balance: 1000.00,
      totalWagered: 0,
      totalWins: 0
    };

    await set(ref(database, 'users/' + uid), userData);
    
    const initialBetHistory = {
      history: [
        {
          game: "Aviator",
          betAmount: 0,
          cashoutAmount: 0,
          multiplier: 0,
          result: 0,
          timestamp: Date.now(),
          status: "welcome"
        }
      ]
    };
    
    await set(ref(database, 'users/' + uid + '/betHistory'), initialBetHistory);

    document.getElementById("signupBox").classList.add("hidden");
    document.getElementById("successScreen").classList.remove("hidden");
    document.getElementById("userEmail").innerText = email;
    status.innerText = "";

  } catch (e) {
    let errorMsg = e.message;
    if (e.code === 'auth/email-already-in-use') {
      errorMsg = 'This email is already registered. Please login or use another email.';
    } else if (e.code === 'auth/invalid-email') {
      errorMsg = 'Invalid email format.';
    } else if (e.code === 'auth/weak-password') {
      errorMsg = 'Password should be at least 6 characters.';
    }
    status.innerText = errorMsg;
  }
};

window.login = async () => {
  try {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    if (!email || !password) {
      status.innerText = "Please enter email and password";
      return;
    }

    const userCredential = await signInWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;

    if (!user.emailVerified) {
      status.innerText = "Please verify your email first! Check your inbox.";
      return;
    }

    status.innerText = "Login successful! Redirecting...";
    setTimeout(() => {
      window.location.href = "homepage.html";
    }, 1000);
    
  } catch (e) {
    let errorMsg = e.message;
    if (e.code === 'auth/user-not-found' || e.code === 'auth/wrong-password') {
      errorMsg = 'Invalid email or password.';
    } else if (e.code === 'auth/invalid-email') {
      errorMsg = 'Invalid email format.';
    }
    status.innerText = errorMsg;
  }
};

window.showSignup = () => {
  document.getElementById("signupBox").classList.remove("hidden");
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("successScreen").classList.add("hidden");
  document.getElementById("signupTab").classList.add("active");
  document.getElementById("loginTab").classList.remove("active");
  clearErrors();
  status.innerText = "";
};

window.showLogin = () => {
  document.getElementById("signupBox").classList.add("hidden");
  document.getElementById("loginBox").classList.remove("hidden");
  document.getElementById("successScreen").classList.add("hidden");
  document.getElementById("loginTab").classList.add("active");
  document.getElementById("signupTab").classList.remove("active");
  clearErrors();
  status.innerText = "";
};

window.strengthCheck = () => {
  let val = document.getElementById("signupPassword").value;
  let bar = document.getElementById("strengthBar");
  let s = Math.min(val.length * 10, 100);
  bar.style.width = s + "%";
};
</script>

</body>
</html>
